<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=2.0, user-scalable=yes">
    <meta name="description" content="IETLS Listening Dictation Practice">
    <title>IELTS Listening Vocabulary Practice</title>
    <link rel="stylesheet" href="style.css">
    <link rel="icon" href="https://app-writeup.britishcouncilexams.cn/favicon.ico">
</head>
<body>
    <div class="container">
        <header>
            <h1>IETLS Listening Dictation Practice</h1>
            <div class="stats" aria-label="练习统计">
                <span>Words Practiced: <span id="total-attempts">0</span></span>
                <span>Correct: <span id="correct-count">0</span></span>
                <span>Correction Rate: <span id="accuracy">0</span>%</span>
            </div>
        </header>
        <div class="info-bar">
            <span>Total: <span id="word-count">0</span></span>
            <span>Time: <span id="timer-display">00:00</span></span>
        </div>
        <main>
            <div class="theme-selector">
                <label class="sr-only" for="theme-left">Cambridge IELTS Lists</label>
                <select id="theme-left" class="theme-select"><option value="" disabled selected>-- Cambridge IELTS Vol. --</option></select>
                <label class="sr-only" for="theme-right">Lists by Themes</label>
                <select id="theme-right" class="theme-select"><option value="" disabled selected>-- Theme List --</option></select>
            </div>
            <div class="word-card">
                <div class="typing-area">
                    <div id="letter-boxes" class="letter-boxes" aria-label="拼写输入区域"></div>
                    <button id="speak-btn" class="speak-btn" type="button" aria-label="朗读当前单词">🔊</button>
                </div>
                <input type="text" id="hidden-input" class="hidden-input" autocomplete="off" autocapitalize="none" spellcheck="false" inputmode="text" aria-label="输入听到的单词">
                <div class="button-group">
                    <button id="action-btn" class="action-btn" type="button">Check</button>
                    <button id="show-answer-btn" class="show-answer-btn" type="button">Answer</button>
                </div>
                <div id="message" class="message" aria-live="polite"></div>
                <div id="translation" class="translation" aria-live="polite"></div>
                <div id="tip" class="tip"></div>
            </div>
        </main>
        <footer class="footer"><p>Designed &amp; Developed By <span>Jimmy Wu</span> © 2025</p></footer>
    </div>
    <script src="script.js"></script>
</body>
</html>
